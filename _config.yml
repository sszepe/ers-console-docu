title: Entity Registry System
description: Developer, Admin, and User Documentation for the ERS Django backend and ERS Console frontend.
theme: minima
url: "https://sszepe.github.io"
baseurl: "/ers-docs"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
plugins:
  - jekyll-feed

# Minima: suppress auto-generated page list in header (we use header.html override)
minima:
  header_pages: []

nav:
  - title: "🚀 Quickstart"
    url: /quickstart/
  - title: User Guide
    url: /docs/user/
    children:
      - title: Introduction
        url: /docs/user/
      - title: Persons
        url: /docs/user/persons/
      - title: Organisations
        url: /docs/user/organisations/
      - title: Organigrams
        url: /docs/user/organigrams/
      - title: Affiliations
        url: /docs/user/affiliations/
      - title: Journals
        url: /docs/user/journals/
      - title: Places
        url: /docs/user/places/
      - title: Imports
        url: /docs/user/imports/
      - title: Review Workflow
        url: /docs/user/review/
      - title: Audit Log
        url: /docs/user/audit/
  - title: Developer Guide
    url: /docs/developer/
    children:
      - title: Overview
        url: /docs/developer/
      - title: Django Backend
        url: /docs/developer/backend/
      - title: REST API Reference
        url: /docs/developer/api/
      - title: ERS Console (Frontend)
        url: /docs/developer/frontend/
      - title: Data Model
